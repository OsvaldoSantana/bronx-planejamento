<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programação Semanal — Bronx</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ BLUEPRINT OPERATIONS — design system ============ */
:root{
  --bg:#E9EDF2; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#F1F5F9; --line:#D3DCE4; --line2:#E8EDF2;
  --grid:rgba(40,70,100,.05);
  --ink:#13202B; --ink2:#51626E; --ink3:#8696A3;
  --acc:#E8551F; --acc-d:#C2430F; --accsoft:#FCEBE3;
  --ok:#0E7A4F; --okbg:#E3F4EC; --bad:#C8323A; --badbg:#FBE6E7; --warn:#9A6700; --warnbg:#FBF1D8;
  --headerbg:rgba(247,249,251,.82); --grp:#E6EEF4; --today:#FFF7F3;
  --shadow:0 26px 64px -22px rgba(18,40,64,.40);
  --elev:0 1px 2px rgba(18,40,64,.05),0 10px 26px -16px rgba(18,40,64,.28);
  --elev2:0 2px 5px rgba(18,40,64,.08),0 20px 44px -22px rgba(18,40,64,.40);
}
html[data-theme="dark"]{
  --bg:#0C1015; --bg2:#141A21; --panel:#19212A; --panel2:#1F2831; --line:#2A3540; --line2:#1E2730;
  --grid:rgba(120,160,200,.05);
  --ink:#E9EEF3; --ink2:#9BA8B4; --ink3:#69747F;
  --acc:#FF6A2C; --acc-d:#D2511E; --accsoft:#2A1206;
  --ok:#34C08E; --okbg:#0F2A22; --bad:#E5484D; --badbg:#2C1416; --warn:#F5A524; --warnbg:#2C2410;
  --headerbg:rgba(12,16,21,.82); --grp:#10161D; --today:#141B25;
  --shadow:0 30px 80px rgba(0,0,0,.6);
  --elev:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.65);
  --elev2:0 2px 6px rgba(0,0,0,.5),0 22px 50px -22px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(1100px 480px at 74% -160px,rgba(232,85,31,.06),transparent 72%),
    var(--bg);
  background-size:30px 30px,30px 30px,100% 100%,auto;background-attachment:fixed;}
h1,h2,h3{font-family:"Archivo",sans-serif;margin:0;letter-spacing:-.012em;font-weight:800}
.mono{font-family:"IBM Plex Mono",monospace}
.wrap{max-width:1340px;margin:0 auto;padding:0 20px 80px}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border:3px solid transparent;background-clip:padding-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--ink3)}

/* ===== header / command bar ===== */
header{position:sticky;top:0;z-index:30;background:var(--headerbg);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.hbar{max-width:1340px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{position:relative;padding-left:132px}
.brand::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:114px;height:34px;background:var(--logo-k) left center/contain no-repeat}
[data-theme="dark"] [data-theme="dark"] .brand::before{background-image:var(--logo-w)}
.brand .t{font-family:"Archivo";font-weight:800;font-size:18px;text-transform:uppercase;line-height:1.05;display:block}
.brand .s{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--acc);letter-spacing:.18em;text-transform:uppercase;margin-top:4px;display:block}
.weeknav{display:flex;align-items:center;gap:7px}
.weeknav button{background:var(--panel);border:1px solid var(--line);color:var(--ink);width:31px;height:31px;border-radius:9px;cursor:pointer;font-size:15px;box-shadow:var(--elev);transition:.15s}
.weeknav button:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
.weeklabel{font-family:"IBM Plex Mono";font-size:13px;min-width:142px;text-align:center;font-weight:600}
.htools{display:flex;gap:8px;margin-left:auto;align-items:center}
.icobtn{background:var(--panel);border:1px solid var(--line);color:var(--ink2);height:33px;padding:0 12px;border-radius:9px;cursor:pointer;font-size:11.5px;font-family:"IBM Plex Mono";font-weight:500;display:flex;align-items:center;gap:6px;box-shadow:var(--elev);transition:.15s}
.icobtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
.kpis{display:flex;gap:7px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 13px;min-width:72px;box-shadow:var(--elev);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink3);opacity:.5}
.kpi b{font-family:"Archivo";font-size:20px;display:block;line-height:1;font-weight:800}
.kpi span{font-family:"IBM Plex Mono";font-size:8.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em;margin-top:3px;display:block}
.kpi.acc b{color:var(--acc)}.kpi.acc::after{background:var(--acc);opacity:1}
.kpi.bad b{color:var(--bad)}.kpi.bad::after{background:var(--bad);opacity:1}
.kpi.warn b{color:var(--warn)}.kpi.warn::after{background:var(--warn);opacity:1}
.kpi.ok b{color:var(--ok)}.kpi.ok::after{background:var(--ok);opacity:1}

/* ===== tabs ===== */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);max-width:1340px;margin:0 auto;padding:0 20px;flex-wrap:wrap}
.tab{font-family:"Archivo";font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;color:var(--ink3);cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;transition:.15s;margin-bottom:-1px}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.view{padding-top:22px;animation:viewin .42s cubic-bezier(.2,.7,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.hide{display:none!important}
.muted{color:var(--ink3);font-size:12px;font-family:"IBM Plex Mono"}

/* ===== week bar / toolbars ===== */
.weekbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--elev)}
.weekbar-lbl{font-family:"IBM Plex Mono";font-size:13px;font-weight:700;letter-spacing:.04em;padding:0 6px}
.toolbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center}

/* ===== section titles ===== */
.dem{margin-bottom:20px}
.demtitle{font-family:"Archivo";font-size:15px;font-weight:800;margin-bottom:11px;padding-left:13px;position:relative}
.demtitle::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:3px;background:var(--acc)}
.demtitle small{display:block;font-family:"IBM Plex Sans";font-weight:400;font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.45;letter-spacing:0;text-transform:none}
.section-t{font-family:"Archivo";font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;color:var(--ink2);margin:6px 0 11px;padding-left:11px;position:relative}
.section-t::before{content:"";position:absolute;left:0;top:1px;bottom:1px;width:3px;border-radius:2px;background:var(--acc)}

/* ===== stat cards (banner) ===== */
.banner{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bcard{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--elev);position:relative;overflow:hidden;animation:viewin .5s both}
.bcard::after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:var(--accsoft);opacity:.5}
.banner .bcard:nth-child(1){animation-delay:.03s}.banner .bcard:nth-child(2){animation-delay:.08s}.banner .bcard:nth-child(3){animation-delay:.13s}.banner .bcard:nth-child(4){animation-delay:.18s}
.bcard .d{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;position:relative}
.bcard .n{font-family:"Archivo";font-weight:800;font-size:26px;margin-top:3px;line-height:1;position:relative}
.bcard.has .n{color:var(--bad)}.bcard.zero .n{color:var(--ok)}.bcard.acc .n{color:var(--acc)}
.bcard.has::after{background:var(--badbg)}.bcard.zero::after{background:var(--okbg)}
.bcard .x{font-size:11px;color:var(--ink3);margin-top:2px;font-family:"IBM Plex Mono";position:relative}

/* ===== generic table (schedule / conf) ===== */
.scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);max-height:74vh;background:var(--bg2);box-shadow:var(--elev)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);vertical-align:top}
thead th{position:sticky;top:0;z-index:10;background:var(--panel2);font-family:"IBM Plex Mono";font-size:10px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;text-align:center;border-bottom:1.5px solid var(--line)}
thead th .dn{display:block;color:var(--ink);font-size:13px;margin-top:3px;font-family:"Archivo";font-weight:800}
.colobra{position:sticky;left:0;z-index:5;background:var(--panel2);min-width:188px;max-width:188px;text-align:left!important}
thead th.colobra{z-index:15}
tbody td.colobra{background:var(--panel);box-shadow:7px 0 14px -10px rgba(18,40,64,.30)}
.obra-n{font-weight:700;font-size:13px;line-height:1.15;padding:9px 11px 0;font-family:"Archivo"}
.obra-m{font-family:"IBM Plex Mono";font-size:9px;color:var(--ink3);margin:4px 0 4px;padding:0 11px;display:flex;gap:6px;flex-wrap:wrap}
.grp td{background:var(--grp);font-family:"Archivo";font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);padding:8px 11px;position:sticky;left:0;border-bottom:1.5px solid var(--line)}
.cell{padding:6px;min-width:128px;background:var(--bg2)}
.cell.today{background:var(--today)}
tbody tr:hover .cell{background:color-mix(in srgb,var(--acc) 4%,var(--bg2))}

/* ===== chips ===== */
.chip{display:block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--fam,#888);border-radius:9px;padding:6px 9px;margin-bottom:5px;cursor:pointer;transition:.14s;box-shadow:0 1px 2px rgba(18,40,64,.05)}
.chip:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:var(--elev)}
.chip.open{border-style:dashed;background:var(--warnbg);border-left-color:var(--warn)}
.chip .w{font-weight:600;font-size:12px;display:flex;align-items:center;gap:7px}
.chip.open .w{color:var(--warn)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink3);flex:0 0 auto;cursor:pointer;transition:.14s}
.dot:hover{border-color:var(--ok);transform:scale(1.12)}
.chip.done .dot{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 3px var(--okbg)}
.chip.done .w{color:var(--ink2)}
.chip .sv{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink2);margin-top:3px;line-height:1.3}
.chip .lo{color:var(--acc);font-weight:600}
.addc{width:100%;background:none;border:1.5px dashed var(--line);color:var(--ink3);border-radius:9px;padding:5px;cursor:pointer;font-size:15px;line-height:1;transition:.14s}
.addc:hover{border-color:var(--acc);color:var(--acc);background:var(--accsoft)}

/* ===== conferência ===== */
.confcell{padding:8px;text-align:center;font-family:"IBM Plex Mono";font-size:10.5px;min-width:96px}
.cf-free{background:var(--badbg);color:var(--bad)}.cf-ok{background:var(--okbg);color:var(--ok)}.cf-warn{background:var(--warnbg);color:var(--warn);font-weight:600}
.cf-ok b{display:block;color:var(--ink);font-size:11px}
.colw{position:sticky;left:0;z-index:5;background:var(--panel);min-width:150px;text-align:left!important;padding:8px 11px;font-weight:700;font-size:12.5px;font-family:"Archivo";box-shadow:7px 0 14px -10px rgba(18,40,64,.30)}

/* ===== demand / diário rows ===== */
.demwrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg2);box-shadow:var(--elev)}
.demrow{display:grid;grid-template-columns:1.3fr 1.7fr 60px 56px 56px 92px;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:12.5px;transition:.12s}
.demrow:last-child{border-bottom:none}
.demrow:not(.h):hover{background:var(--panel2)}
.demrow.h{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;background:var(--panel2);font-weight:600}
.saldo-falta{color:var(--bad);font-weight:700}.saldo-ok{color:var(--ok);font-weight:700}.saldo-sobra{color:var(--warn);font-weight:700}
.diafrente{display:grid;grid-template-columns:1.7fr 120px 80px 1.5fr;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line2);transition:.12s}
.diafrente:last-child{border-bottom:none}.diafrente:hover{background:var(--panel2)}
.dia-h{font-size:12.5px;font-weight:600}.dia-p{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink3);margin-top:4px}
.dia-in label{font-family:"IBM Plex Mono";font-size:9px;color:var(--ink2);text-transform:uppercase;display:block;margin-bottom:3px;letter-spacing:.05em}
.dia-in input{width:80px}
.dia-prod{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--ok);text-align:center;font-weight:700}
.obra-pdo{font-family:"IBM Plex Mono";font-size:9px;color:var(--ink2);padding:0 11px 9px;line-height:1.35}

/* ===== metas ===== */
.metaobra{margin-bottom:18px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg2);box-shadow:var(--elev)}
.metahead{display:flex;align-items:center;gap:11px;padding:13px 16px;background:var(--panel2);border-bottom:1px solid var(--line)}
.metahead h3{font-size:15px}.metahead .cli{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink2)}
.metahead .reu{margin-left:auto;font-family:"IBM Plex Mono";font-size:10px;color:var(--ink3)}
.metarow{display:grid;grid-template-columns:34px 1.6fr 150px 96px 1fr 88px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2);font-size:12.5px;transition:.12s}
.metarow:last-child{border-bottom:none}.metarow:hover{background:var(--panel2)}
.metarow .fase{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink3);text-align:center}
.metarow .loc{font-weight:700;line-height:1.25;font-family:"Archivo"}.metarow .loc small{display:block;font-weight:400;color:var(--ink3);font-family:"IBM Plex Mono";font-size:10px;margin-top:3px;letter-spacing:0}
.metarow .dts{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--ink2);line-height:1.5}
.metarow .dts .r{color:var(--acc)}
.badge{font-family:"Archivo";font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding:5px 9px;border-radius:20px;text-align:center;white-space:nowrap;display:inline-block}
.b-fut{background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.b-run{background:var(--accsoft);color:var(--acc);border:1px solid var(--acc)}
.b-late{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.b-done{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.mbar{height:7px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-d));border-radius:6px}
.metarow .ed{cursor:pointer;color:var(--ink3);text-align:center;transition:.14s}.metarow .ed:hover{color:var(--acc);transform:scale(1.15)}

/* ===== evolução ===== */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ecard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--elev);transition:.16s}
.ecard:hover{box-shadow:var(--elev2);transform:translateY(-2px)}
.ecard h3{font-size:14px;display:flex;justify-content:space-between;align-items:baseline}.ecard h3 small{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink3);font-weight:400}
.estat{display:flex;gap:18px;margin:12px 0 9px}.estat div b{font-family:"Archivo";font-size:22px;display:block;line-height:1;font-weight:800}.estat div span{font-family:"IBM Plex Mono";font-size:9px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.bar{height:9px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-d));border-radius:6px}
.barlab{display:flex;justify-content:space-between;font-family:"IBM Plex Mono";font-size:10px;color:var(--ink2);margin:10px 0 4px}
.dist .drow{display:grid;grid-template-columns:130px 1fr 44px;gap:9px;align-items:center;margin-bottom:6px;font-family:"IBM Plex Mono";font-size:11px}

/* ===== cadastros ===== */
.cadcols{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.cadcols{grid-template-columns:1fr}}
.cadbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--elev)}
.cadlist{max-height:300px;overflow:auto;margin-top:11px}
.caditem{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:var(--bg2);transition:.12s}
.caditem:hover{border-color:var(--acc)}
.caditem .x{cursor:pointer;color:var(--ink3);font-size:16px;padding:0 4px;transition:.14s}.caditem .x:hover{color:var(--bad)}
.cadadd{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}

/* ===== inputs / buttons ===== */
input,select,textarea{font-family:inherit;font-size:13px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;transition:.14s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
.btn{font-family:"Archivo";font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;border:none;border-radius:9px;padding:10px 15px;cursor:pointer;transition:.15s}
.btn:active{transform:translateY(1px)}
.btn.p{background:linear-gradient(150deg,var(--acc),var(--acc-d));color:#fff;box-shadow:0 8px 20px -8px var(--acc)}
.btn.p:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.g{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--elev)}.btn.g:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
.btn.d{background:none;color:var(--bad);border:1px solid var(--bad)}.btn.d:hover{background:var(--badbg)}
.btn.sm{padding:7px 11px;font-size:11px}

/* ===== modal ===== */
.ov{position:fixed;inset:0;background:rgba(10,16,24,.55);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;animation:viewin .2s}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:100%;max-width:440px;padding:22px;box-shadow:var(--shadow);max-height:90vh;overflow:auto;animation:viewin .26s}
.modal h3{font-size:17px;margin-bottom:4px}.modal .mc{font-family:"IBM Plex Mono";font-size:11px;color:var(--acc);margin-bottom:16px}
.fld{margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
.fld label{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select,.fld textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}.chk input{width:16px;height:16px;accent-color:var(--acc)}
.mact{display:flex;gap:9px;margin-top:18px}.mact .btn{flex:1}.mact .side{flex:0 0 auto}
@media print{header,.toolbar,.addc,.tabs,.htools,.weekbar{display:none!important}.scroll{max-height:none;border:none;box-shadow:none}body{background:#fff}}
/* ===== cell UX + color coding ===== */
.chip{position:relative}
.chip[draggable="true"]{cursor:grab}
.chip.dragging{opacity:.4;cursor:grabbing}
.chip-cp{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink3);background:var(--panel2);border:1px solid var(--line);opacity:0;transition:.12s;cursor:pointer}
.chip:hover .chip-cp{opacity:1}
.chip-cp:hover{color:var(--acc);border-color:var(--acc)}
.cell.dragover{outline:2px dashed var(--acc);outline-offset:-3px;background:var(--accsoft)!important}
.paste{width:100%;background:var(--accsoft);border:1px dashed var(--acc);color:var(--acc);border-radius:8px;padding:5px;cursor:pointer;font-family:"IBM Plex Mono";font-size:10px;font-weight:600;margin-bottom:5px;transition:.12s}
.paste:hover{background:var(--acc);color:#fff}
.svtag{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle;flex:0 0 auto}
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;padding:9px 13px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--elev);font-size:11.5px}
.legend-t{font-family:"IBM Plex Mono";font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600}
.legend-item{display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:500}
.swatch{width:11px;height:11px;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.fecharow{display:grid;grid-template-columns:1.6fr 116px 150px 92px 1.3fr 116px;gap:13px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line2)}
.fecharow:last-child{border-bottom:none}
.fc-id b{font-family:"Archivo";font-size:13px;font-weight:700}
.fc-sub{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink3);margin-top:4px;display:flex;align-items:center}
.fc-ex label{font-family:"IBM Plex Mono";font-size:9px;color:var(--ink2);text-transform:uppercase;display:block;margin-bottom:3px;letter-spacing:.05em}
.fc-ex input{width:104px}
.fc-fis .barlab{margin:0 0 4px}
.fc-prod{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink2);text-align:center;line-height:1.5}.fc-prod b{color:var(--ok)}
.fc-oc{width:100%}
.ctrlcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--elev);margin-bottom:14px;overflow:hidden;transition:.16s}
.ctrlcard:hover{box-shadow:var(--elev2)}
.ctrlhead{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--panel2);border-bottom:1px solid var(--line)}
.ctrlhead h3{font-size:15px}
.ctrlhead .resp{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink3);margin-left:auto}
.ctrl-status{font-family:"Archivo";font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding:5px 11px;border-radius:20px}
.st-ok{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.st-warn{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.st-bad{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.ctrl-cols{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:1px;background:var(--line2)}
@media(max-width:720px){.ctrl-cols{grid-template-columns:1fr}}
.ctrl-col{background:var(--panel);padding:14px 16px}
.ctrl-col h4{font-family:"IBM Plex Mono";font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin:0 0 9px;font-weight:600}
.ctrl-big{font-family:"Archivo";font-weight:800;font-size:23px;line-height:1}
.ctrl-sub{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink2);margin-top:4px}
.twobar{margin-top:9px}
.twobar .lab{display:flex;justify-content:space-between;font-family:"IBM Plex Mono";font-size:9px;color:var(--ink2);margin-bottom:3px}
.alerts{padding:11px 16px;border-top:1px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap}
.alert{font-family:"IBM Plex Mono";font-size:10.5px;padding:4px 10px;border-radius:7px;background:var(--badbg);color:var(--bad);display:flex;align-items:center;gap:5px}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.ok{background:var(--okbg);color:var(--ok)}
.quadro{background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--elev)}
.q-head{display:flex;align-items:center;gap:22px;border-bottom:3px solid #111;padding-bottom:13px;margin-bottom:18px}
.q-title{font-family:"Archivo";font-weight:800;font-size:21px;color:#111;letter-spacing:-.01em}
.q-sub{font-family:"IBM Plex Mono";font-size:9.5px;color:#555;margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.q-date{margin-left:auto;text-align:right}
.q-dn{font-family:"Archivo";font-weight:800;font-size:16px;color:#111}
.q-dd{font-family:"IBM Plex Mono";font-size:12px;color:#333;margin-top:2px}
.q-meta{font-family:"IBM Plex Mono";font-size:11px;color:#333;border-left:1px solid #bbb;padding-left:18px;line-height:2.1}
.q-obra{margin-bottom:18px;break-inside:avoid;page-break-inside:avoid}
.q-obra-h{font-family:"Archivo";font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;background:#eee;color:#111;padding:8px 11px;border:1px solid #bbb;border-bottom:none}
.q-obra-h span{font-family:"IBM Plex Mono";font-weight:400;font-size:10px;color:#666;text-transform:none;margin-left:9px}
.q-tbl{width:100%;border-collapse:collapse}
.q-tbl th{font-family:"IBM Plex Mono";font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#444;background:#f5f5f5;border:1px solid #bbb;padding:6px 9px;text-align:left}
.q-tbl td{border:1px solid #bbb;padding:10px 9px;font-size:12px;height:36px;vertical-align:top;color:#111}
.q-tbl td i{color:#999}
.q-tbl .svtag{box-shadow:none}
.q-ck{width:48px;text-align:center}
.q-box{display:inline-block;width:17px;height:17px;border:1.5px solid #333;border-radius:3px;background:#fff}
.q-blank td{height:32px;background:#fcfcfc}
.q-foot{margin-top:16px;font-family:"IBM Plex Mono";font-size:10px;color:#666;border-top:1px dashed #bbb;padding-top:10px}
@media print{
  @page{size:landscape;margin:11mm}
  body{background:#fff!important}
  header,.tabs,.quadro-tools,.connbadge{display:none!important}
  .view{padding:0!important}
  .quadro{border:none!important;box-shadow:none!important;padding:0!important}
}
.rtbl{width:100%;border-collapse:collapse}
.rtbl th{font-family:"IBM Plex Mono";font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);text-align:left;padding:10px 16px;background:var(--panel2);border-bottom:1px solid var(--line)}
.rtbl td{padding:9px 16px;font-size:12.5px;border-bottom:1px solid var(--line2);color:var(--ink2)}
.rtbl tr:last-child td{border-bottom:none}
.saldo-ok{color:var(--ok);font-weight:600}
.gantt-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--elev);padding:16px 18px;overflow-x:auto}
.q-logo{width:120px;height:30px;background:var(--logo-k) left center/contain no-repeat;margin-right:14px}.q-logo img{height:36px;width:auto}
.q2-scroll{overflow-x:auto;margin-top:6px}
.q2-tbl{border-collapse:collapse;width:100%;min-width:1180px;table-layout:fixed}
.q2-tbl th,.q2-tbl td{border:1px solid #bdbdbd}
.q2-obra{width:148px;background:#f3f3f3;text-align:left;padding:8px 9px;font-family:"Archivo";font-size:12px;color:#111;vertical-align:top}
.q2-resp{font-family:"IBM Plex Mono";font-size:9px;color:#777;margin-top:3px}
.q2-day{background:#ececec;color:#111;font-family:"Archivo";font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:6px 4px;text-align:center}
.q2-sub{background:#f7f7f7;color:#555;font-family:"IBM Plex Mono";font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;padding:4px 2px;text-align:center;font-weight:600}
.q2-atr{background:#fbeeee}
.q2-day.q2-wknd,.q2-sub.q2-wknd{background:#eef1f4}
.q2-cell{height:74px;padding:5px 4px;vertical-align:top;background:#fff}
.q2-cell.q2-atr{background:#fdf6f6}
.q2-cell.q2-wknd{background:#fafbfc}
.pslot{display:block;border:1px dashed #c9c9c9;border-radius:4px;height:28px;margin:0 0 5px}
.q2-cell.q2-atr .pslot{border-color:#e2b8b8}
.q2-how{margin-top:16px;border-top:2px solid #111;padding-top:12px}
.q2-how-t{font-family:"Archivo";font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#111;margin-bottom:9px}
.q2-steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.q2-steps>div{border-left:3px solid #E8551F;padding-left:11px}
.q2-steps b{display:block;font-family:"Archivo";font-size:12px;color:#111;margin-bottom:4px}
.q2-steps span{font-family:"IBM Plex Mono";font-size:10px;color:#444;line-height:1.5}
@media print{.q2-scroll{overflow:visible}.q2-tbl{min-width:0}}

const svc=id=>state.services.find(s=>s.id===id);
const wkr=id=>state.workers.find(w=>w.id===id);
const obr=id=>state.obras.find(o=>o.id===id);

const weekAllocs=()=>{const ds=new Set(weekDates());return state.allocations.filter(a=>ds.has(a.date));};

function networkdays(a,b){if(!a||!b)return 0;let d=parseISO(a);const e=parseISO(b);if(d>e)return 0;let n=0,g=0;while(d<=e&&g<2000){const w=d.getDay();if(w!==0&&w!==6)n++;d.setDate(d.getDate()+1);g++;}return n;}
function metaCalc(m){const s=svc(m.serviceId);const prod=s?s.prod:0;const du=networkdays(m.iniPlan,m.fimPlan);if(!m.m2||!prod||du<=0)return null;const ritmo=m.m2/du;return {du,ritmo,ef:Math.ceil(ritmo/prod),prod};}
function metaActiveWeek(m){const ds=weekDates();const ws=ds[0],we=ds[5];const end=m.fimReal||m.fimPlan;return m.iniPlan&&end&&m.iniPlan<=we&&end>=ws;}
function efetivoAlocado(m){const ds=new Set(weekDates());const set=new Set();state.allocations.forEach(a=>{if(a.obraId===m.obraId&&a.serviceId===m.serviceId&&a.workerId&&ds.has(a.date))set.add(a.workerId);});return set.size;}
function frentesDoDia(day){const map={};state.allocations.filter(a=>a.date===day).forEach(a=>{const k=day+"|"+a.obraId+"|"+a.serviceId+"|"+(a.local||"");if(!map[k])map[k]={obraId:a.obraId,serviceId:a.serviceId,local:a.local||"",key:k,workers:[]};if(a.workerId)map[k].workers.push(a.workerId);});return Object.values(map);}
function getProducao(key){return state.producoes.find(p=>p.key===key);}
function m2AcumMeta(m){return m.m2exec||0;}
function hdReal(obraId,serviceId){return state.allocations.filter(a=>a.obraId===obraId&&a.serviceId===serviceId&&a.workerId&&a.realizado).length;}
function prodApurada(sid){let m2=0;const obras=new Set();state.metas.forEach(m=>{if(m.serviceId===sid&&(m.m2exec||0)>0){m2+=m.m2exec;obras.add(m.obraId);}});let hd=0;obras.forEach(ob=>hd+=hdReal(ob,sid));return hd>0?m2/hd:null;}
function obraPdoWeek(oid){const ms=state.metas.filter(m=>m.obraId===oid&&metaActiveWeek(m));if(!ms.length)return null;let fim=null,fis=0,nec=0,alo=0,nf=0;ms.forEach(m=>{if(!fim||m.fimPlan<fim)fim=m.fimPlan;const c=metaCalc(m);if(c){nec+=c.ef;alo+=efetivoAlocado(m);}if(m.m2){fis+=Math.min(100,m2AcumMeta(m)/m.m2*100);nf++;}});return {fim,fis:nf?Math.round(fis/nf):null,nec,alo};}
function demandaHTML(){
  const act=state.metas.filter(metaActiveWeek);
  let nec=0,alo=0;const rows=act.map(m=>{const c=metaCalc(m);const o=obr(m.obraId);const need=c?c.ef:0;const al=efetivoAlocado(m);nec+=need;alo+=al;return {o:o?o.nome:'?',loc:m.local||m.fase,cod:svc(m.serviceId)?svc(m.serviceId).cod:'',color:svcColor(m.serviceId),m2:m.m2||0,need,al,saldo:need-al};});
  const vagas=rows.reduce((s,r)=>s+Math.max(0,r.saldo),0);
  let h=`<div class="dem"><div class="demtitle">Demanda da semana<small>Quanto efetivo cada frente do PDO exige nesta semana × quanto você já alocou. Vermelho = falta gente para cumprir o prazo.</small></div><div class="banner">${bcard(act.length,"Frentes ativas","acc")}${bcard(nec,"Efetivo necessário")}${bcard(alo,"Efetivo alocado",alo>=nec&&nec>0?"zero":"")}${bcard(vagas,"Vagas a preencher",vagas>0?"has":"zero")}</div>`;
  if(act.length){

    rows.sort((a,b)=>b.saldo-a.saldo).forEach(r=>{const cls=r.saldo>0?'saldo-falta':(r.saldo<0?'saldo-sobra':'saldo-ok');const txt=r.saldo>0?('faltam '+r.saldo):(r.saldo<0?('sobra '+(-r.saldo)):'ok');
      h+=`<div class="demrow"><span style="font-weight:600">${r.o}</span><span><span class="svtag" style="background:${r.color}"></span>${r.loc} <span class="muted">${r.cod}</span></span><span class="mono">${r.m2}</span><span class="mono">${r.need}</span><span class="mono">${r.al}</span><span class="${cls}">${txt}</span></div>`;});

function metaStatus(m){
  const t=todayISO();
  if(m.fimReal)return m.fimReal<=m.fimPlan?{k:"done",l:"Concluída no prazo",p:100}:{k:"done",l:`Concluída +${dayDiff(m.fimPlan,m.fimReal)}d`,p:100};
  if(t>m.fimPlan)return {k:"late",l:`Atrasada ${dayDiff(m.fimPlan,t)}d`,p:100};
  const start=m.iniReal||m.iniPlan;
  if(t>=start){const tot=Math.max(1,dayDiff(m.iniPlan,m.fimPlan));const el=Math.max(0,Math.min(tot,dayDiff(m.iniPlan,t)));return {k:"run",l:"Em andamento",p:Math.round(el/tot*100)};}
  return {k:"fut",l:`Inicia ${fmtDM(m.iniPlan)}`,p:0};
}

function resourceWeeks(){
  const ms=state.metas.filter(m=>m.iniPlan&&m.fimPlan&&m.m2);if(!ms.length)return [];
  const today=todayISO();
  const minIni=ms.reduce((a,m)=>m.iniPlan<a?m.iniPlan:a,ms[0].iniPlan);
  const maxFim=ms.reduce((a,m)=>m.fimPlan>a?m.fimPlan:a,ms[0].fimPlan);
  const s0=minIni<today?today:minIni;
  let cur=iso(mondayOf(parseISO(s0)));const weeks=[];let guard=0;
  while(cur<=maxFim&&guard<16){weeks.push(cur);cur=addDays(cur,7);guard++;}
  return weeks;
}

const wkrOpts=sel=>`<option value="" ${!sel?"selected":""}>— A definir —</option>`+[...state.workers].sort((a,b)=>a.nome.localeCompare(b.nome)).map(w=>`<option value="${w.id}" ${w.id===sel?"selected":""}>${w.nome}</option>`).join("");
const obrOpts=sel=>state.obras.map(o=>`<option value="${o.id}" ${o.id===sel?"selected":""}>${o.nome}</option>`).join("");
function dayOpts(sel){const ds=weekDates();let o=ds.map((d,i)=>`<option value="${d}" ${d===sel?'selected':''}>${DAYS[i]} ${fmtDM(d)}</option>`);if(sel&&!ds.includes(sel))o.unshift(`<option value="${sel}" selected>${fmtDM(sel)}</option>`);return o.join('');}

function openAdd(o,d){const ob=obr(o);modal(`<h3>Alocar</h3><div class="mc">${ob.nome} · ${fmtDM(d)}</div>
  <div class="fld"><label>Funcionário (ou deixe “A definir”)</label><select id="m-w">${wkrOpts("")}</select></div>
  <div class="fld"><label>Frente / Serviço (EAP)</label><select id="m-s">${svcOpts("04.1")}</select></div>
  <div class="fld"><label>Pavimento / local</label><input id="m-l" placeholder="ex.: 20º Pvto, Lazer, SS3"></div>
  <label class="chk"><input type="checkbox" id="m-r"> Já executado</label>
  <div class="mact"><button class="btn g" data-act="closemodal">Cancelar</button><button class="btn p" data-act="saveadd" data-o="${o}" data-d="${d}">Alocar</button></div>`);}
function openEdit(id){const a=state.allocations.find(x=>x.id===id);const ob=obr(a.obraId);modal(`<h3>Editar / mover alocação</h3><div class="mc">${ob.nome} · ${fmtDM(a.date)}</div>
  <div class="row2"><div class="fld"><label>Obra (mover)</label><select id="m-o">${obrOpts(a.obraId)}</select></div><div class="fld"><label>Dia (mover)</label><select id="m-day">${dayOpts(a.date)}</select></div></div>
  <div class="fld"><label>Funcionário</label><select id="m-w">${wkrOpts(a.workerId)}</select></div>
  <div class="fld"><label>Frente / Serviço</label><select id="m-s">${svcOpts(a.serviceId)}</select></div>
  <div class="fld"><label>Pavimento / local</label><input id="m-l" value="${a.local||''}"></div>
  <label class="chk"><input type="checkbox" id="m-r" ${a.realizado?'checked':''}> Executado</label>
  <div class="mact"><button class="btn d side" data-act="delalloc" data-id="${id}">Excluir</button><button class="btn g side" data-act="repeat" data-id="${id}">↻ Semana</button><button class="btn p" data-act="saveedit" data-id="${id}">Salvar</button></div>`);}
function openMeta(id){const m=id?state.metas.find(x=>x.id===id):null;modal(`<h3>${m?'Editar':'Nova'} meta (PDO)</h3><div class="mc">Acordo com o cliente</div>
  <div class="fld"><label>Obra</label><select id="x-o">${obrOpts(m?m.obraId:'')}</select></div>
  <div class="row2"><div class="fld"><label>Fase / item</label><input id="x-f" value="${m?m.fase:''}" placeholder="Fase 1"></div><div class="fld"><label>m² a executar</label><input id="x-m2" type="number" value="${m?(m.m2||''):''}"></div></div>
  <div class="fld"><label>Local / descrição</label><input id="x-l" value="${m?m.local:''}" placeholder="Tipos (4º ao 28º Pav)"></div>
  <div class="row2"><div class="fld"><label>Serviço (EAP, opcional)</label><select id="x-s">${svcOpts(m?m.serviceId:'',true)}</select></div><div class="fld"><label>Preço R$/m² (contrato)</label><input id="x-pr" type="number" value="${m?(m.preco||''):''}"></div></div>
  <div class="row2"><div class="fld"><label>Início planejado</label><input id="x-ip" type="date" value="${m?m.iniPlan:''}"></div><div class="fld"><label>Fim planejado</label><input id="x-fp" type="date" value="${m?m.fimPlan:''}"></div></div>
  <div class="row2"><div class="fld"><label>Início real</label><input id="x-ir" type="date" value="${m?m.iniReal:''}"></div><div class="fld"><label>Fim real</label><input id="x-fr" type="date" value="${m?m.fimReal:''}"></div></div>
  <div class="fld"><label>Data da reunião PDO</label><input id="x-reu" type="date" value="${m?m.reuniao:todayISO()}"></div>
  <div class="mact">${m?`<button class="btn d side" data-act="delmeta" data-id="${id}">Excluir</button>`:''}<button class="btn g side" data-act="closemodal">Cancelar</button><button class="btn p" data-act="savemeta" data-id="${m?id:''}">Salvar</button></div>`);}

function downloadCSV(name,rows){const csv="\uFEFF"+rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(";")).join("\r\n");const b=new Blob([csv],{type:"text/csv"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

const val=id=>document.getElementById(id).value;
document.addEventListener("click",async e=>{
  const tb=e.target.closest("[data-tab]");if(tb){setTab(tb.dataset.tab);return;}
  if(e.target.id==="ov"){closeModal();return;}
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="undo"){if(undoStack.length){state=JSON.parse(undoStack.pop());await save();renderAll();}return;}
  if(MUT.has(a))snapshot();
  if(a==="wk"){state.weekStart=addDays(state.weekStart,7*Number(t.dataset.d));await save();renderAll();}
  else if(a==="thisweek"){snapshot();state.weekStart=iso(mondayOf(new Date()));await save();renderAll();}
  else if(a==="copychip"){const al=state.allocations.find(x=>x.id===t.dataset.id);if(al){const w=wkr(al.workerId);clip={workerId:al.workerId,serviceId:al.serviceId,local:al.local,nome:w?w.nome:'vaga'};renderProg();}}
  else if(a==="pastecell"){if(clip){snapshot();state.allocations.push({id:uid(),date:t.dataset.d,obraId:t.dataset.o,serviceId:clip.serviceId,workerId:clip.workerId,local:clip.local,realizado:false});await save();renderAll();}}
  else if(a==="adoptprod"){const s=state.services.find(x=>x.id===t.dataset.id);const ap=prodApurada(t.dataset.id);if(s&&ap){s.prod=Math.round(ap*10)/10;await save();renderAll();}}
  else if(a==="concluir"){snapshot();const m=state.metas.find(x=>x.id===t.dataset.id);if(m){m.fimReal=todayISO();await save();renderAll();}}
  else if(a==="reabrir"){snapshot();const m=state.metas.find(x=>x.id===t.dataset.id);if(m){m.fimReal="";await save();renderAll();}}
  else if(a==="addsvc"){const cod=(val("ns-cod")||"").trim(),nome=(val("ns-nome")||"").trim(),prod=Number(val("ns-prod"))||0;if(cod&&nome&&!state.services.find(s=>s.id===cod)){snapshot();state.services.push({id:cod,cod,nome,prod});await save();renderCad();}else if(state.services.find(s=>s.id===cod)){alert("Já existe um serviço com esse código.");}}
  else if(a==="delsvc"){const id=t.dataset.id;const na=state.allocations.filter(x=>x.serviceId===id).length;const nm=state.metas.filter(m=>m.serviceId===id).length;if((na||nm)&&!confirm(`Este serviço tem ${na} alocação(ões) e ${nm} meta(s) usando ele. Excluir mesmo assim?`))return;snapshot();state.services=state.services.filter(s=>s.id!==id);await save();renderCad();}
  else if(a==="day"){state.dayView=addDays(state.dayView||weekDates()[0],Number(t.dataset.d));await save();renderAll();}
  else if(a==="theme"){state.theme=state.theme==="dark"?"light":"dark";applyTheme();await save();renderHeader();}
  else if(a==="add")openAdd(t.dataset.o,t.dataset.d);
  else if(a==="edit")openEdit(t.dataset.id);
  else if(a==="closemodal")closeModal();
  else if(a==="done"){const al=state.allocations.find(x=>x.id===t.dataset.id);al.realizado=!al.realizado;await save();renderAll();}
  else if(a==="saveadd"){state.allocations.push({id:uid(),date:t.dataset.d,obraId:t.dataset.o,workerId:val("m-w"),serviceId:val("m-s"),local:val("m-l"),realizado:document.getElementById("m-r").checked});await save();closeModal();renderAll();}
  else if(a==="saveedit"){const al=state.allocations.find(x=>x.id===t.dataset.id);al.obraId=val("m-o");al.date=val("m-day");al.workerId=val("m-w");al.serviceId=val("m-s");al.local=val("m-l");al.realizado=document.getElementById("m-r").checked;await save();closeModal();renderAll();}
  else if(a==="delalloc"){state.allocations=state.allocations.filter(x=>x.id!==t.dataset.id);await save();closeModal();renderAll();}
  else if(a==="repeat"){const al=state.allocations.find(x=>x.id===t.dataset.id);weekDates().forEach(d=>{if(!state.allocations.some(x=>x.date===d&&x.obraId===al.obraId&&x.workerId===al.workerId&&x.serviceId===al.serviceId))state.allocations.push({id:uid(),date:d,obraId:al.obraId,workerId:al.workerId,serviceId:al.serviceId,local:al.local,realizado:false});});await save();closeModal();renderAll();}
  else if(a==="addmeta")openMeta("");
  else if(a==="editmeta")openMeta(t.dataset.id);
  else if(a==="savemeta"){const id=t.dataset.id;const data={obraId:val("x-o"),fase:val("x-f"),m2:Number(val("x-m2"))||0,local:val("x-l"),serviceId:val("x-s"),preco:Number(val("x-pr"))||0,iniPlan:val("x-ip"),fimPlan:val("x-fp"),iniReal:val("x-ir"),fimReal:val("x-fr"),reuniao:val("x-reu")};if(id){Object.assign(state.metas.find(m=>m.id===id),data);}else{state.metas.push({id:uid(),...data});}await save();closeModal();renderAll();}
  else if(a==="delmeta"){state.metas=state.metas.filter(m=>m.id!==t.dataset.id);await save();closeModal();renderAll();}
  else if(a==="addw"){const n=val("nw").trim();if(n){state.workers.push({id:uid(),nome:n,funcao:"Aplicador"});await save();renderCad();renderHeader();}}
  else if(a==="delw"){const id=t.dataset.id;const n=state.allocations.filter(x=>x.workerId===id).length;if(n>0&&!confirm(`Este funcionário tem ${n} alocação(ões) na base. Excluir vai transformá-las em vagas "a definir". Continuar?`))return;snapshot();state.allocations.forEach(x=>{if(x.workerId===id)x.workerId="";});state.workers=state.workers.filter(x=>x.id!==id);await save();renderAll();}
  else if(a==="addo"){const n=val("no").trim();if(n){state.obras.push({id:uid(),nome:n,cliente:val("nc")||"—",status:val("ns"),resp:val("nr")||"—"});await save();renderCad();}}
  else if(a==="delo"){const id=t.dataset.id;const na=state.allocations.filter(x=>x.obraId===id).length;const nm=state.metas.filter(m=>m.obraId===id).length;if((na||nm)&&!confirm(`Esta obra tem ${na} alocação(ões) e ${nm} meta(s). Excluir remove tudo. Continuar?`))return;snapshot();state.allocations=state.allocations.filter(x=>x.obraId!==id);state.metas=state.metas.filter(m=>m.obraId!==id);state.producoes=state.producoes.filter(p=>p.obraId!==id);state.obras=state.obras.filter(x=>x.id!==id);await save();renderAll();}
  else if(a==="gotocad")setTab("cad");
  else if(a==="print")window.print();
  else if(a==="expesc"){const rows=[["Data","Obra","Cliente","Responsável","Funcionário","Serviço","Local","Status"]];weekDates().forEach(d=>state.allocations.filter(x=>x.date===d).forEach(al=>{const o=obr(al.obraId);rows.push([fmtDMY(d),o?o.nome:'',o?o.cliente:'',o?o.resp:'',al.workerId?wkr(al.workerId).nome:'A DEFINIR',svc(al.serviceId)?svc(al.serviceId).nome:'',al.local||'',al.realizado?'Executado':'Planejado']);}));downloadCSV("escala_bronx.csv",rows);}
  else if(a==="expmeta"){const rows=[["Obra","Fase","Local","Dias","Início Plan","Fim Plan","Início Real","Fim Real","Status","Reunião"]];state.metas.forEach(m=>{const o=obr(m.obraId);rows.push([o?o.nome:'',m.fase,m.local,m.dias,fmtDMY(m.iniPlan),fmtDMY(m.fimPlan),fmtDMY(m.iniReal),fmtDMY(m.fimReal),metaStatus(m).l,fmtDMY(m.reuniao)]);});downloadCSV("metas_pdo_bronx.csv",rows);}
  else if(a==="expjson"){const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const x=document.createElement("a");x.href=u;x.download="programacao_bronx.json";x.click();URL.revokeObjectURL(u);}
  else if(a==="reset"){if(confirm("Apagar tudo e recarregar exemplo?")){if(fbRef){seed();await save();}else{await store.del(KEY);seed();await save();}applyTheme();renderAll();}}
});

document.addEventListener("change",async e=>{
  const pf=e.target.closest("[data-prodfor]");
  if(pf){snapshot();const s=state.services.find(x=>x.id===pf.dataset.prodfor);if(s){s.prod=Number(pf.value)||0;await save();renderAll();}return;}
  const mm=e.target.closest("[data-metam2],[data-metaocor]");
  if(mm){snapshot();const id=mm.dataset.metam2||mm.dataset.metaocor;const m=state.metas.find(x=>x.id===id);if(m){if(mm.hasAttribute("data-metam2"))m.m2exec=Number(mm.value)||0;else m.ocor=mm.value;await save();renderAll();}return;}
  const t=e.target.closest("[data-m2key],[data-ocorkey]");
  if(t){snapshot();const key=t.dataset.m2key||t.dataset.ocorkey;let p=state.producoes.find(x=>x.key===key);if(!p){p={key,date:t.dataset.dt,obraId:t.dataset.ob,serviceId:t.dataset.sv,local:t.dataset.lo,m2:0,ocor:""};state.producoes.push(p);}if(t.hasAttribute("data-m2key"))p.m2=Number(t.value)||0;if(t.hasAttribute("data-ocorkey"))p.ocor=t.value;await save();renderAll();}
});
document.addEventListener("dragstart",e=>{const c=e.target.closest("[data-aid]");if(c){dragAid=c.dataset.aid;c.classList.add("dragging");if(e.dataTransfer){e.dataTransfer.effectAllowed="copyMove";try{e.dataTransfer.setData("text/plain",dragAid);}catch(_){}}}});
document.addEventListener("dragend",e=>{const c=e.target.closest("[data-aid]");if(c)c.classList.remove("dragging");document.querySelectorAll(".cell.dragover").forEach(x=>x.classList.remove("dragover"));});
document.addEventListener("dragover",e=>{const cell=e.target.closest("[data-drop]");if(cell){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect=(e.ctrlKey||e.metaKey||e.altKey)?"copy":"move";cell.classList.add("dragover");}});
document.addEventListener("dragleave",e=>{const cell=e.target.closest("[data-drop]");if(cell&&!cell.contains(e.relatedTarget))cell.classList.remove("dragover");});
document.addEventListener("drop",async e=>{const cell=e.target.closest("[data-drop]");if(!cell||!dragAid)return;e.preventDefault();cell.classList.remove("dragover");const parts=cell.dataset.drop.split("|");const ob=parts[0],dt=parts[1];const al=state.allocations.find(x=>x.id===dragAid);if(al&&!(al.obraId===ob&&al.date===dt)){snapshot();if(e.ctrlKey||e.metaKey||e.altKey){state.allocations.push({id:uid(),date:dt,obraId:ob,serviceId:al.serviceId,workerId:al.workerId,local:al.local,realizado:false});}else{al.obraId=ob;al.date=dt;}await save();renderAll();}dragAid=null;});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&clip){clip=null;if(tab==="prog")renderProg();}});
function applyTheme(){document.documentElement.setAttribute("data-theme",state.theme||"light");}
function setTab(n){tab=n;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===n));["prog","conf","mapa","diario","quadro","metas","gantt","evo","ctrl","cad"].forEach(v=>document.getElementById("v-"+v).classList.toggle("hide",v!==n));renderAll();}
function renderAll(){renderHeader();if(tab==="prog")renderProg();else if(tab==="conf")renderConf();else if(tab==="mapa")renderMapa();else if(tab==="diario")renderDiario();else if(tab==="quadro")renderQuadro();else if(tab==="metas")renderMetas();else if(tab==="gantt")renderGantt();else if(tab==="evo")renderEvo();else if(tab==="ctrl")renderCtrl();else if(tab==="cad")renderCad();}
(async function init(){
  if(startBackend()){updateConn();return;}
  const s=await load();if(s&&s.obras&&s.allocations&&s.metas&&s.producoes){state=s;ensureDefaults();}else{seed();await save();}
  applyTheme();renderAll();updateConn();
})();
</script>
